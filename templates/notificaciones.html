{% extends "base.html" %}
{% block title %}Notificaciones{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-bell"></i> Notificaciones</h2>
    {% if notifs %}
    <form method="post" action="{{ url_for('notificaciones_leer_todas') }}">
        <button type="submit" class="btn btn-outline-secondary btn-sm">Marcar todas como leídas</button>
    </form>
    {% endif %}
</div>

<div class="list-group">
    {% for n in notifs %}
    <form method="post" action="{{ url_for('notificacion_leer', id=n.id) }}" class="list-group-item list-group-item-action {% if not n.is_read %}list-group-item-primary{% endif %}">
        <button type="submit" class="btn btn-link text-start text-decoration-none text-dark w-100 p-0">
            <div class="d-flex w-100 justify-content-between">
                <h6 class="mb-1 {% if not n.is_read %}fw-bold{% endif %}">
                    {% if n.type == 'cita' %}<i class="bi bi-calendar-event text-warning"></i>
                    {% elif n.type == 'venta' %}<i class="bi bi-cart-check text-success"></i>
                    {% else %}<i class="bi bi-info-circle text-primary"></i>{% endif %}
                    {{ n.title }}
                </h6>
                <small class="text-muted">{{ n.created_at.strftime('%d/%m/%Y %H:%M') }}</small>
            </div>
            {% if n.message %}<p class="mb-1 small text-muted">{{ n.message }}</p>{% endif %}
            {% if not n.is_read %}<span class="badge bg-primary">Nueva</span>{% endif %}
        </button>
    </form>
    {% else %}
    <div class="text-center text-muted py-5">No tienes notificaciones.</div>
    {% endfor %}
</div>
{% endblock %}
