{% extends "base.html" %}
{% block title %}{% if service %}Editar{% else %}Nuevo{% endif %} Servicio{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header">{% if service %}Editar servicio{% else %}Nuevo servicio{% endif %}</div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="name" class="form-control" required value="{{ service.name if service else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="description" class="form-control" rows="2">{{ service.description if service else '' }}</textarea>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio *</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0" name="price" class="form-control" required
                                       value="{{ service.price if service else '0' }}">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Duración (minutos)</label>
                            <input type="number" min="5" name="duration_minutes" class="form-control"
                                   value="{{ service.duration_minutes if service else 30 }}">
                        </div>
                    </div>
                    {% if service %}
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if service.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Servicio activo</label>
                    </div>
                    {% endif %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('admin_servicios') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
