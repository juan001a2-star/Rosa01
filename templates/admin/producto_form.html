{% extends "base.html" %}
{% block title %}{% if product %}Editar{% else %}Nuevo{% endif %} Producto{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-7">
        <div class="card">
            <div class="card-header">
                {% if product %}Editar producto{% else %}Nuevo producto{% endif %}
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <label class="form-label">Nombre *</label>
                        <input type="text" name="name" class="form-control" required value="{{ product.name if product else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <textarea name="description" class="form-control" rows="2">{{ product.description if product else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Categoría</label>
                        <select name="category_id" class="form-select">
                            <option value="">— Sin categoría —</option>
                            {% for c in categories %}
                            <option value="{{ c.id }}" {% if product and product.category_id == c.id %}selected{% endif %}>{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio de compra *</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0" name="purchase_price" class="form-control" required
                                       value="{{ product.purchase_price if product else '0' }}">
                            </div>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Precio de venta *</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" step="0.01" min="0" name="sale_price" class="form-control" required
                                       value="{{ product.sale_price if product else '0' }}">
                            </div>
                        </div>
                    </div>
                    {% if not product %}
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock inicial</label>
                            <input type="number" min="0" name="stock" class="form-control" value="0">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Stock mínimo (alerta)</label>
                            <input type="number" min="0" name="min_stock" class="form-control" value="5">
                        </div>
                    </div>
                    {% else %}
                    <div class="mb-3">
                        <label class="form-label">Stock mínimo (alerta)</label>
                        <input type="number" min="0" name="min_stock" class="form-control" value="{{ product.min_stock }}">
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_active" id="is_active" {% if product.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="is_active">Producto activo (visible en catálogo)</label>
                    </div>
                    {% endif %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Guardar</button>
                        <a href="{{ url_for('admin_productos') }}" class="btn btn-outline-secondary">Cancelar</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
