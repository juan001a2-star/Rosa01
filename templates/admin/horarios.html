{% extends "base.html" %}
{% block title %}Horarios de atención{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-clock"></i> Horarios de atención</h2>
    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-outline-secondary btn-sm">← Volver</a>
</div>

<div class="card">
    <div class="card-body">
        <form method="post">
            <div class="table-responsive">
                <table class="table align-middle">
                    <thead>
                        <tr>
                            <th>Día</th>
                            <th>Cerrado</th>
                            <th>Apertura</th>
                            <th>Cierre</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for i in range(7) %}
                        {% set h = hours.get(i) %}
                        <tr>
                            <td><strong>{{ days[i] }}</strong></td>
                            <td>
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" name="closed_{{ i }}" id="closed_{{ i }}"
                                           {% if h and h.is_closed %}checked{% endif %}
                                           onchange="toggleDay({{ i }})">
                                </div>
                            </td>
                            <td>
                                <input type="time" name="open_{{ i }}" id="open_{{ i }}" class="form-control"
                                       value="{{ h.open_time if h and h.open_time else '09:00' }}"
                                       {% if h and h.is_closed %}disabled{% endif %}>
                            </td>
                            <td>
                                <input type="time" name="close_{{ i }}" id="close_{{ i }}" class="form-control"
                                       value="{{ h.close_time if h and h.close_time else '18:00' }}"
                                       {% if h and h.is_closed %}disabled{% endif %}>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <button type="submit" class="btn btn-primary">Guardar horarios</button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
function toggleDay(i) {
    const closed = document.getElementById('closed_' + i).checked;
    document.getElementById('open_' + i).disabled = closed;
    document.getElementById('close_' + i).disabled = closed;
}
</script>
{% endblock %}
