{% extends "base.html" %}
{% block title %}Nueva Venta{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h2><i class="bi bi-cart-plus"></i> Nueva Venta</h2>
    <a href="{{ url_for('admin_caja') }}" class="btn btn-outline-secondary btn-sm">← Volver a caja</a>
</div>

<form method="post" id="ventaForm">
    <div class="row">
        <div class="col-lg-8">
            <div class="card mb-3">
                <div class="card-header d-flex justify-content-between">
                    <span>Agregar ítems</span>
                </div>
                <div class="card-body">
                    <div class="row g-2 mb-3">
                        <div class="col-md-4">
                            <select id="tipoItem" class="form-select">
                                <option value="product">Producto</option>
                                <option value="service">Servicio</option>
                            </select>
                        </div>
                        <div class="col-md-5">
                            <select id="itemSelect" class="form-select">
                                {% for p in products %}
                                <option value="product-{{ p.id }}" data-type="product" data-id="{{ p.id }}" data-price="{{ p.sale_price }}" data-stock="{{ p.stock }}" data-name="{{ p.name }}">
                                    {{ p.name }} (${{ '%.2f'|format(p.sale_price) }}) — stock {{ p.stock }}
                                </option>
                                {% endfor %}
                                {% for s in services %}
                                <option value="service-{{ s.id }}" data-type="service" data-id="{{ s.id }}" data-price="{{ s.price }}" data-name="{{ s.name }}" class="d-none service-opt">
                                    {{ s.name }} (${{ '%.2f'|format(s.price) }})
                                </option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-2">
                            <input type="number" id="qtyInput" class="form-control" value="1" min="1">
                        </div>
                        <div class="col-md-1">
                            <button type="button" class="btn btn-primary w-100" onclick="addItem()"><i class="bi bi-plus"></i></button>
                        </div>
                    </div>
                    <div class="table-responsive">
                        <table class="table" id="itemsTable">
                            <thead>
                                <tr>
                                    <th>Ítem</th>
                                    <th class="text-center">Cant.</th>
                                    <th class="text-end">P. Unit.</th>
                                    <th class="text-end">Subtotal</th>
                                    <th></th>
                                </tr>
                            </thead>
                            <tbody id="itemsBody"></tbody>
                            <tfoot>
                                <tr>
                                    <td colspan="3" class="text-end fw-bold">TOTAL</td>
                                    <td class="text-end fw-bold fs-5" id="totalDisplay">$0.00</td>
                                    <td></td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                    <div id="hiddenInputs"></div>
                </div>
            </div>
        </div>
        <div class="col-lg-4">
            <div class="card">
                <div class="card-header">Detalles de la venta</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Cliente (opcional)</label>
                        <select name="client_id" class="form-select">
                            <option value="">— Sin cliente —</option>
                            {% for c in clients %}
                            <option value="{{ c.id }}">{{ c.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Método de pago</label>
                        <select name="payment_method" class="form-select">
                            <option value="efectivo">Efectivo</option>
                            <option value="tarjeta">Tarjeta</option>
                            <option value="transferencia">Transferencia</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Notas</label>
                        <textarea name="notes" class="form-control" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100" id="btnSubmit" disabled>
                        <i class="bi bi-check-lg"></i> Registrar venta
                    </button>
                </div>
            </div>
        </div>
    </div>
</form>
{% endblock %}

{% block extra_js %}
<script>
let items = [];
const tipoItem = document.getElementById('tipoItem');
const itemSelect = document.getElementById('itemSelect');

tipoItem.addEventListener('change', function() {
    const isProd = this.value === 'product';
    document.querySelectorAll('#itemSelect option').forEach(opt => {
        if (opt.value === '') return;
        const t = opt.dataset.type;
        if (isProd) {
            opt.classList.toggle('d-none', t !== 'product');
        } else {
            opt.classList.toggle('d-none', t !== 'service');
        }
    });
    // Select first visible
    const first = Array.from(itemSelect.options).find(o => !o.classList.contains('d-none') && o.value);
    if (first) itemSelect.value = first.value;
});

function addItem() {
    const opt = itemSelect.options[itemSelect.selectedIndex];
    if (!opt || !opt.value) return;
    const type = opt.dataset.type;
    const id = opt.dataset.id;
    const name = opt.dataset.name;
    const price = parseFloat(opt.dataset.price);
    const stock = parseInt(opt.dataset.stock || 9999);
    let qty = parseInt(document.getElementById('qtyInput').value) || 1;
    if (type === 'product' && qty > stock) {
        alert('Stock insuficiente. Disponible: ' + stock);
        return;
    }
    // Check if already in list
    const existing = items.find(i => i.type === type && i.id === id);
    if (existing) {
        if (type === 'product' && existing.qty + qty > stock) {
            alert('Stock insuficiente.');
            return;
        }
        existing.qty += qty;
        existing.sub = existing.qty * existing.price;
    } else {
        items.push({ type, id, name, price, qty, sub: qty * price });
    }
    renderItems();
}

function removeItem(idx) {
    items.splice(idx, 1);
    renderItems();
}

function renderItems() {
    const tbody = document.getElementById('itemsBody');
    const hidden = document.getElementById('hiddenInputs');
    tbody.innerHTML = '';
    hidden.innerHTML = '';
    let total = 0;
    items.forEach((it, idx) => {
        total += it.sub;
        tbody.innerHTML += `
            <tr>
                <td>${it.name}</td>
                <td class="text-center">${it.qty}</td>
                <td class="text-end">$${it.price.toFixed(2)}</td>
                <td class="text-end">$${it.sub.toFixed(2)}</td>
                <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="removeItem(${idx})"><i class="bi bi-trash"></i></button></td>
            </tr>`;
        hidden.innerHTML += `
            <input type="hidden" name="item_type" value="${it.type}">
            <input type="hidden" name="item_id" value="${it.id}">
            <input type="hidden" name="quantity" value="${it.qty}">`;
    });
    document.getElementById('totalDisplay').textContent = '$' + total.toFixed(2);
    document.getElementById('btnSubmit').disabled = items.length === 0;
}

// Init product options visible
tipoItem.dispatchEvent(new Event('change'));
</script>
{% endblock %}
